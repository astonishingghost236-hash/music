<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#09060f">
    <meta name="description" content="Browse and play your YouTube playlists.">
    <title>Music Player</title>
    <link rel="stylesheet" href="/styles.css?v=6">
    <script src="/app.js?v=6" defer></script>
  </head>
  <body>
    <main class="app">
      <section class="home-screen" id="home-screen" aria-label="Music player">
        <div class="background-image" aria-hidden="true"></div>
        <header class="player-header">
          <span class="brand">MUSIC PLAYER</span>
          <button class="icon-button playlist-open" id="open-playlist" type="button" aria-label="Open playlist">
            <span class="sprite-icon icon-queue" aria-hidden="true"></span>
          </button>
        </header>

        <div class="player-content">
          <div class="player-stage" id="player-stage">
            <div class="stage-cover" id="stage-cover" role="img" aria-label="Album artwork"></div>
            <div class="youtube-player-wrap" id="youtube-player-wrap" hidden></div>
          </div>

          <div class="track-details">
            <div class="track-cover" id="now-cover">
              <img id="now-cover-image" src="/assets/headphones.png" alt="">
            </div>
            <div class="track-copy">
              <strong id="now-title">Choose a playlist</strong>
              <span id="now-artist">Your music will appear here</span>
            </div>
            <span class="audio-label">YOUTUBE</span>
          </div>

          <p class="player-message" id="player-message" role="status" aria-live="polite"></p>

          <div class="player-controls" aria-label="Playback controls">
            <button class="icon-button secondary-control" id="shuffle-button" type="button" aria-label="Shuffle off" aria-pressed="false">
              <span class="sprite-icon icon-shuffle" aria-hidden="true"></span>
            </button>
            <button class="icon-button secondary-control" id="previous-button" type="button" aria-label="Previous track" disabled>
              <span class="sprite-icon icon-previous" aria-hidden="true"></span>
            </button>
            <button class="play-button" id="play-button" type="button" aria-label="Play" disabled>
              <span class="sprite-icon icon-play" aria-hidden="true"></span>
              <span class="pause-icon" aria-hidden="true"><i></i><i></i></span>
            </button>
            <button class="icon-button secondary-control" id="next-button" type="button" aria-label="Next track" disabled>
              <span class="sprite-icon icon-next" aria-hidden="true"></span>
            </button>
            <button class="icon-button secondary-control" id="repeat-button" type="button" aria-label="Repeat off" aria-pressed="false">
              <span class="sprite-icon icon-repeat" aria-hidden="true"></span>
            </button>
          </div>
        </div>
        <div class="player-footer">OFFICIAL YOUTUBE PLAYER</div>
      </section>

      <section class="playlist-screen" id="playlist-screen" aria-label="Playlist" hidden>
        <header class="list-header">
          <button class="back-button" id="back-button" type="button"><span aria-hidden="true">←</span> Back to player</button>
          <span class="brand">PLAYLIST</span>
        </header>

        <div class="list-content">
          <h1 id="playlist-title">Your playlist</h1>
          <p class="list-description">Paste a YouTube playlist link to see its songs and thumbnails.</p>
          <form class="playlist-form" id="playlist-form">
            <label class="sr-only" for="playlist-url">YouTube playlist URL</label>
            <input id="playlist-url" name="url" type="url" placeholder="https://www.youtube.com/playlist?list=..." autocomplete="url" required>
            <button id="load-button" type="submit"><span>Load playlist</span></button>
          </form>
          <p class="list-message" id="list-message" role="status" aria-live="polite"></p>

          <div class="list-heading">
            <h2>Songs</h2>
            <span id="track-count">No playlist loaded</span>
          </div>
          <p class="playlist-note" id="playlist-note" role="status"></p>
          <div class="queue-list" id="queue-list">
            <p class="queue-empty">Your playlist songs will appear here.</p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
